- performance_analysis_starter.py:
    - description: Complete all TODOs in the starter code
      command: >
        python -c "import sys; sys.tracebacklimit=0; import re; text=open('performance_analysis_starter.py','r',encoding='utf-8').read(); count=len(re.findall(r'TODO', text)); assert count==0, f'Found {count} TODOs in performance_analysis_starter.py'"

- description: Verify naive allocation behavior
  command: >
    python -c "import sys; sys.tracebacklimit=0; import performance_analysis_starter as m; bm=[1,0,0,1,0,0,0]; snap=bm[:]; assert m.naive_allocate(bm,2)==[1,2], 'naive_allocate should return first free blocks'; assert bm==snap, 'naive_allocate should not mutate bitmap'; assert m.naive_allocate(bm,3)==[1,2,4], 'naive_allocate should select blocks in order'; assert m.naive_allocate(bm,10) is None, 'naive_allocate should return None when insufficient space'; print('naive_allocate checks passed')"

- description: Verify FFS allocation behavior
  command: >
    python -c "import sys; sys.tracebacklimit=0; import performance_analysis_starter as m; bm=[0]*200; [bm.__setitem__(i,1) for i in range(50,55)]; blocks=m.ffs_allocate(bm,3,1); assert blocks==[55,56,57], 'ffs_allocate should allocate within the group'; assert all(50 <= b < 100 for b in blocks), 'ffs_allocate should stay within group bounds'; assert m.ffs_allocate(bm,60,1) is None, 'ffs_allocate should return None when group is full'; blocks=m.ffs_allocate(bm,2,0); assert all(0 <= b < 50 for b in blocks), 'ffs_allocate should not use other groups'; print('ffs_allocate checks passed')"

- description: Verify simulation structure and allocations
  command: >
    python -c "import sys; sys.tracebacklimit=0; import performance_analysis_starter as m; m.NUM_BLOCKS=12; m.BLOCK_GROUP_SIZE=6; m.NUM_GROUPS=2; m.NUM_FILES=5; m.FILE_SIZES=[2,3,1,2,2]; r=m.simulate('naive'); assert 'seeks' in r and 'fragmentation' in r and 'allocation_time' in r and 'space_util' in r and 'files' in r and 'used_blocks' in r, 'simulate should return all required keys'; assert len(r['files'])==m.NUM_FILES, 'files list length should match NUM_FILES'; assert all(r['files']), 'All files should allocate blocks in this scenario'; flat=[b for blocks in r['files'] for b in blocks]; assert len(flat)==r['used_blocks'], 'used_blocks should match allocated blocks'; assert len(set(flat))==len(flat), 'Allocated blocks should be unique'; assert all(0 <= b < m.NUM_BLOCKS for b in flat), 'Blocks should stay within disk bounds'; r=m.simulate('ffs'); assert 'seeks' in r and 'fragmentation' in r and 'allocation_time' in r and 'space_util' in r and 'files' in r and 'used_blocks' in r, 'simulate should return all required keys'; assert len(r['files'])==m.NUM_FILES, 'files list length should match NUM_FILES'; assert all(r['files']), 'All files should allocate blocks in this scenario'; flat=[b for blocks in r['files'] for b in blocks]; assert len(flat)==r['used_blocks'], 'used_blocks should match allocated blocks'; assert len(set(flat))==len(flat), 'Allocated blocks should be unique'; assert all(0 <= b < m.NUM_BLOCKS for b in flat), 'Blocks should stay within disk bounds'; print('simulate structure checks passed')"

- description: Verify simulation metrics
  command: >
    python -c "import sys; sys.tracebacklimit=0; import math; import performance_analysis_starter as m; m.NUM_BLOCKS=12; m.BLOCK_GROUP_SIZE=6; m.NUM_GROUPS=2; m.NUM_FILES=5; m.FILE_SIZES=[2,3,1,2,2]; seeks=lambda blocks: sum(1 for i in range(1,len(blocks)) if blocks[i]!=blocks[i-1]+1); frag=lambda blocks: (max(blocks)-min(blocks)) if blocks else 0; r=m.simulate('naive'); expected=sum(seeks(b) for b in r['files']); expected_frag=sum(frag(b) for b in r['files']); assert r['seeks']==expected, 'simulate should compute seeks correctly'; assert r['fragmentation']==expected_frag, 'simulate should compute fragmentation correctly'; expected_util=r['used_blocks']/m.NUM_BLOCKS; assert math.isclose(r['space_util'], expected_util, rel_tol=1e-9), 'space_util should match used_blocks'; assert r['allocation_time']>=0, 'allocation_time should be non-negative'; r=m.simulate('ffs'); expected=sum(seeks(b) for b in r['files']); expected_frag=sum(frag(b) for b in r['files']); assert r['seeks']==expected, 'simulate should compute seeks correctly'; assert r['fragmentation']==expected_frag, 'simulate should compute fragmentation correctly'; expected_util=r['used_blocks']/m.NUM_BLOCKS; assert math.isclose(r['space_util'], expected_util, rel_tol=1e-9), 'space_util should match used_blocks'; assert r['allocation_time']>=0, 'allocation_time should be non-negative'; print('simulate metric checks passed')"

- description: Verify reflection sections exist
  command: >
    python -c "import sys; sys.tracebacklimit=0; import re; from pathlib import Path; text=Path('reflection_question.md').read_text(encoding='utf-8'); sec=lambda pat: (re.search(pat, text, re.M|re.S).group(1).strip() if re.search(pat, text, re.M|re.S) else ''); name=sec(r'^##\s+Add your Name\s*$\n([\s\S]*?)(^#|\Z)'); q1=sec(r'^###\s+1\..*?$\n([\s\S]*?)(^#|\Z)'); q3=sec(r'^###\s+3\..*?$\n([\s\S]*?)(^#|\Z)'); q4=sec(r'^###\s+4\..*?$\n([\s\S]*?)(^#|\Z)'); out=re.search(r'```python\s*(.*?)\s*```', text, re.S|re.I); output=(out.group(1).strip() if out else ''); assert name, 'Add your name under Add your Name'; assert q1, 'Question 1 response is missing'; assert q3, 'Question 3 response is missing'; assert q4, 'Question 4 response is missing'; assert output, 'Question 2 output block is empty'; print('reflection presence checks passed')"

- description: Verify reflection word counts
  command: >
    python -c "import sys; sys.tracebacklimit=0; import re; from pathlib import Path; text=Path('reflection_question.md').read_text(encoding='utf-8'); sec=lambda pat: (re.search(pat, text, re.M|re.S).group(1).strip() if re.search(pat, text, re.M|re.S) else ''); wc=lambda t: len(re.findall(r'\b\w+\b', t)); name=sec(r'^##\s+Add your Name\s*$\n([\s\S]*?)(^#|\Z)'); q1=sec(r'^###\s+1\..*?$\n([\s\S]*?)(^#|\Z)'); q3=sec(r'^###\s+3\..*?$\n([\s\S]*?)(^#|\Z)'); q4=sec(r'^###\s+4\..*?$\n([\s\S]*?)(^#|\Z)'); assert wc(name) >= 2, 'Add your full name under Add your Name'; assert wc(q1) >= 5, 'Question 1 response should be at least 5 words'; assert wc(q3) >= 5, 'Question 3 response should be at least 5 words'; assert wc(q4) >= 5, 'Question 4 response should be at least 5 words'; total=wc('\n'.join([q1,q3,q4])); assert total >= 30, 'Reflection responses should total at least 30 words'; print('reflection quality checks passed')"

- description: Verify reflection output block
  command: >
    python -c "import sys; sys.tracebacklimit=0; import re; from pathlib import Path; text=Path('reflection_question.md').read_text(encoding='utf-8'); m=re.search(r'```python\s*(.*?)\s*```', text, re.S|re.I); output=(m.group(1).strip() if m else ''); assert output, 'Question 2 output block is empty'; markers=['Strategy Results','COMPARISON SUMMARY']; assert any(marker in output for marker in markers), 'Question 2 output block should include program output'; print('reflection output checks passed')"
